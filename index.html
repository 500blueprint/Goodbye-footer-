<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moonlight Designs Goodbye Footer</title>

<style>

/* ================================
   BASIC RESET
================================ */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  overflow-x: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #080b20;
}


/* ================================
   🌙 MAIN FOOTER
================================ */

.footer {
  position: relative;

  width: 100%;
  min-height: 700px;

  overflow: hidden;

  padding: 55px 20px 30px;

  text-align: center;

  color: white;

  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(177, 128, 255, 0.35),
      transparent 35%
    ),

    radial-gradient(
      circle at 15% 65%,
      rgba(79, 148, 255, 0.20),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 65%,
      rgba(188, 100, 255, 0.18),
      transparent 30%
    ),

    linear-gradient(
      180deg,
      #111b43 0%,
      #171540 50%,
      #070b21 100%
    );
}


/* ================================
   ✨ BACKGROUND STARS
================================ */

.star-background {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background-image:

    radial-gradient(
      white 1px,
      transparent 1px
    ),

    radial-gradient(
      rgba(210,190,255,.8) 1px,
      transparent 1px
    );

  background-size:
    70px 70px,
    110px 110px;

  background-position:
    0 0,
    35px 45px;

  opacity: .35;
}


/* ================================
   🌙 MOON
================================ */

.moon {
  position: absolute;

  right: 8%;
  top: 50px;

  width: 105px;
  height: 105px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      white,
      #f2ebff 45%,
      #c8b4ff 72%,
      #9c86eb
    );

  box-shadow:
    0 0 15px white,
    0 0 40px rgba(210,190,255,.8),
    0 0 80px rgba(140,170,255,.55);

  animation:
    moonGlow 3s ease-in-out infinite alternate;
}


@keyframes moonGlow {

  from {
    box-shadow:
      0 0 12px white,
      0 0 35px rgba(210,190,255,.65);
  }

  to {
    box-shadow:
      0 0 22px white,
      0 0 60px rgba(210,190,255,.95),
      0 0 100px rgba(130,170,255,.65);
  }

}


/* ================================
   💜 HEADING
================================ */

.title {
  position: relative;
  z-index: 5;

  margin: 0;

  font-size:
    clamp(32px, 6vw, 55px);

  font-weight: 900;

  text-shadow:
    0 0 8px rgba(255,255,255,.55),
    0 0 20px rgba(190,145,255,.65);
}


.message {
  position: relative;
  z-index: 5;

  max-width: 650px;

  margin:
    12px auto 35px;

  font-size:
    clamp(15px, 3vw, 19px);

  line-height: 1.6;

  color: #e8e1ff;
}


/* ================================
   🦉🐈‍⬛ CHARACTERS
================================ */

.characters {
  position: relative;
  z-index: 5;

  width: 100%;
  max-width: 900px;

  margin:
    100px auto 20px;

  display: flex;

  justify-content: center;
  align-items: flex-end;

  gap:
    clamp(20px, 7vw, 90px);
}


.character {
  position: relative;

  width:
    min(300px, 40vw);
}


.character img {
  display: block;

  width: 100%;
  height: auto;

  transform-origin:
    center bottom;

  filter:
    drop-shadow(
      0 0 7px rgba(255,255,255,.45)
    )

    drop-shadow(
      0 0 17px rgba(185,140,255,.55)
    )

    drop-shadow(
      0 0 28px rgba(90,160,255,.35)
    );
}


/* ================================
   🦉 STELLA WAVE
================================ */

.stella img {
  animation:
    stellaWave 2.1s ease-in-out infinite;
}


@keyframes stellaWave {

  0%,
  100% {
    transform:
      translateY(0)
      rotate(-2deg);
  }

  25% {
    transform:
      translateY(-8px)
      rotate(3deg);
  }

  50% {
    transform:
      translateY(0)
      rotate(-1deg);
  }

  75% {
    transform:
      translateY(-5px)
      rotate(4deg);
  }

}


/* ================================
   🐈‍⬛ LUNA WAVE
================================ */

.luna img {
  animation:
    lunaWave 2.5s ease-in-out infinite;
}


@keyframes lunaWave {

  0%,
  100% {
    transform:
      translateY(0)
      rotate(2deg);
  }

  25% {
    transform:
      translateY(-6px)
      rotate(-3deg);
  }

  50% {
    transform:
      translateY(-2px)
      rotate(2deg);
  }

  75% {
    transform:
      translateY(-8px)
      rotate(-4deg);
  }

}


/* ================================
   💬 SPEECH BUBBLES
================================ */

.bubble {
  position: absolute;

  z-index: 10;

  top: -28px;
  left: 50%;

  transform:
    translate(-50%, -100%);

  min-width: 170px;

  padding:
    12px 16px;

  border-radius: 20px;

  color: #28164e;

  background: white;

  font-size: 14px;

  font-weight: 800;

  box-shadow:
    0 0 12px rgba(255,255,255,.6),
    0 0 25px rgba(190,150,255,.6);

  animation:
    bubbleFloat 2.5s ease-in-out infinite;
}


.bubble::after {
  content: "";

  position: absolute;

  bottom: -10px;
  left: 50%;

  transform:
    translateX(-50%);

  border-left:
    10px solid transparent;

  border-right:
    10px solid transparent;

  border-top:
    11px solid white;
}


@keyframes bubbleFloat {

  0%,
  100% {
    transform:
      translate(-50%, -100%)
      translateY(0);
  }

  50% {
    transform:
      translate(-50%, -100%)
      translateY(-6px);
  }

}


/* ================================
   ✨ FALLING MAGIC
================================ */

.magic {
  position: absolute;

  top: -30px;

  z-index: 2;

  pointer-events: none;

  color: white;

  text-shadow:
    0 0 5px white,
    0 0 12px #d7baff,
    0 0 20px #9ccfff;

  animation:
    falling linear forwards;
}


@keyframes falling {

  0% {
    transform:
      translateY(-30px)
      rotate(0deg);

    opacity: 0;
  }

  10% {
    opacity: .9;
  }

  85% {
    opacity: .8;
  }

  100% {
    transform:
      translateY(750px)
      rotate(200deg);

    opacity: 0;
  }

}


/* ================================
   ✨ LITTLE SPARKLES
================================ */

.sparkle {
  position: absolute;

  z-index: 4;

  pointer-events: none;

  color: white;

  text-shadow:
    0 0 7px white,
    0 0 15px #c7a9ff;

  animation:
    twinkle 1.5s ease-in-out infinite alternate;
}


.s1 {
  left: 12%;
  top: 42%;
}


.s2 {
  right: 12%;
  top: 48%;

  animation-delay: .5s;
}


.s3 {
  left: 49%;
  top: 55%;

  animation-delay: 1s;
}


@keyframes twinkle {

  from {
    opacity: .25;

    transform:
      scale(.7)
      rotate(0deg);
  }

  to {
    opacity: 1;

    transform:
      scale(1.4)
      rotate(30deg);
  }

}


/* ================================
   🌙 FOOTER LINKS
================================ */

.links {
  position: relative;
  z-index: 5;

  display: flex;

  justify-content: center;
  flex-wrap: wrap;

  gap:
    12px 25px;

  margin:
    35px auto 20px;
}


.links a {
  color: #ded5ff;

  text-decoration: none;

  font-size: 14px;

  font-weight: 700;

  transition: .25s;
}


.links a:hover {
  color: white;

  text-shadow:
    0 0 8px white,
    0 0 15px #c2a2ff;
}


/* ================================
   COPYRIGHT
================================ */

.copyright {
  position: relative;
  z-index: 5;

  margin-top: 20px;

  font-size: 12px;

  line-height: 1.7;

  color:
    rgba(255,255,255,.6);
}


/* ================================
   📱 MOBILE
================================ */

@media (max-width: 600px) {

  .footer {
    min-height: 610px;

    padding:
      40px 10px 25px;
  }


  .moon {
    width: 70px;
    height: 70px;

    right: 4%;
    top: 25px;
  }


  .characters {
    margin-top: 95px;

    gap: 10px;
  }


  .character {
    width: 44vw;
  }


  .bubble {
    min-width: 125px;

    max-width: 145px;

    padding:
      9px 10px;

    font-size: 11px;
  }


  .links {
    gap:
      10px 17px;
  }

}

</style>

</head>


<body>


<footer class="footer">

  <!-- STARRY BACKGROUND -->

  <div class="star-background"></div>


  <!-- MOON -->

  <div class="moon"></div>


  <!-- SPARKLES -->

  <div class="sparkle s1">
    ✦
  </div>

  <div class="sparkle s2">
    ✧
  </div>

  <div class="sparkle s3">
    ✦
  </div>


  <!-- TITLE -->

  <h1 class="title">
    Thanks for stopping by! ✨
  </h1>


  <p class="message">

    Come back soon — there's always
    more magic being made at
    Moonlight Designs. 🌙

  </p>



  <!-- CHARACTERS -->

  <div class="characters">


    <!-- 🦉 STELLA -->

    <div class="character stella">

      <div class="bubble">
        Thanks for visiting! ✨
      </div>

      <img
        src="./Stella2.PNG"
        alt="Stella">

    </div>



    <!-- 🐈‍⬛ LUNA -->

    <div class="character luna">

      <div class="bubble">
        Come back soon! 🌙
      </div>

      <img
        src="./Luna2.PNG"
        alt="Luna">

    </div>


  </div>



  <!-- LINKS -->

  <div class="links">

    <a
      href="https://payhip.com/MoonlightDesigns87"
      target="_top">
      Home
    </a>

    <a
      href="https://payhip.com/MoonlightDesigns87"
      target="_top">
      Shop
    </a>

    <a
      href="https://payhip.com/MoonlightDesigns87/collection/luna-s-freebies"
      target="_top">
      Freebies
    </a>

  </div>



  <!-- COPYRIGHT -->

  <div class="copyright">

    © 2026 Moonlight Designs

    <br>

    Turning Ideas Into Beautiful Creations ✨

  </div>


</footer>



<script>

/* ==========================================
   ✨ FALLING STARS + MOONS
========================================== */

const footer =
  document.querySelector(".footer");


const symbols = [
  "✦",
  "✧",
  "⋆",
  "★",
  "☾"
];


function makeMagic() {

  const item =
    document.createElement("span");


  item.className =
    "magic";


  item.textContent =
    symbols[
      Math.floor(
        Math.random() * symbols.length
      )
    ];


  item.style.left =
    Math.random() * 100 + "%";


  item.style.fontSize =
    (8 + Math.random() * 14) + "px";


  item.style.animationDuration =
    (6 + Math.random() * 6) + "s";


  footer.appendChild(item);


  setTimeout(
    function () {
      item.remove();
    },
    13000
  );

}


/* Create falling magic */

setInterval(
  makeMagic,
  650
);


/* Start some immediately */

for (
  let i = 0;
  i < 12;
  i++
) {

  setTimeout(
    makeMagic,
    i * 150
  );

}

</script>


</body>

</html>
