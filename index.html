<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moonlight Designs Goodbye</title>

<style>

/* ==========================================
   🌙 RESET
========================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #070b24;
}


/* ==========================================
   🌙 GOODBYE FOOTER
========================================== */

.goodbye {

  position: relative;

  width: 100%;
  min-height: 620px;

  overflow: hidden;

  text-align: center;

  color: white;

  padding:
    45px
    15px
    25px;

  background:

    radial-gradient(
      circle at 50% 10%,
      rgba(164,118,255,.30),
      transparent 32%
    ),

    radial-gradient(
      circle at 15% 70%,
      rgba(73,140,255,.18),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 70%,
      rgba(190,90,255,.15),
      transparent 30%
    ),

    linear-gradient(
      180deg,
      #11183d 0%,
      #13113b 50%,
      #070b24 100%
    );
}


/* ==========================================
   ✨ STATIC STAR FIELD
========================================== */

.starfield {

  position: absolute;

  inset: 0;

  pointer-events: none;

  opacity: .35;

  background-image:

    radial-gradient(
      white 1px,
      transparent 1px
    ),

    radial-gradient(
      rgba(205,185,255,.9) 1px,
      transparent 1px
    );

  background-size:
    75px 75px,
    115px 115px;

  background-position:
    10px 15px,
    45px 60px;
}


/* ==========================================
   🌙 CRESCENT MOON
========================================== */

.moon {

  position: absolute;

  right: 7%;
  top: 35px;

  width: 70px;
  height: 70px;

  border-radius: 50%;

  background: #f6e58d;

  box-shadow:

    0 0 12px white,

    0 0 30px
    rgba(224,203,255,.8),

    0 0 55px
    rgba(142,164,255,.5);
}


.moon::after {

  content: "";

  position: absolute;

  width: 70px;
  height: 70px;

  border-radius: 50%;

  top: -12px;
  left: 19px;

  background: #11183d;
}


/* ==========================================
   ✨ TITLE
========================================== */

.title {

  position: relative;

  z-index: 5;

  margin: 0;

  padding: 0 70px;

  font-size:
    clamp(27px, 5vw, 48px);

  font-weight: 900;

  text-shadow:

    0 0 8px
    rgba(255,255,255,.5),

    0 0 18px
    rgba(187,145,255,.55);
}


.subtitle {

  position: relative;

  z-index: 5;

  max-width: 600px;

  margin:
    12px auto 25px;

  padding: 0 20px;

  font-size:
    clamp(14px, 2.5vw, 18px);

  line-height: 1.5;

  color: #e7e0ff;
}


/* ==========================================
   🦉🐈‍⬛ CHARACTER AREA
========================================== */

.characters {

  position: relative;

  z-index: 10;

  display: flex;

  align-items: flex-end;
  justify-content: center;

  gap:
    clamp(15px, 7vw, 80px);

  width: 100%;

  max-width: 850px;

  margin:
    80px auto 20px;
}


.character {

  position: relative;

  width:
    min(280px, 40vw);
}


/* ==========================================
   CHARACTER IMAGES
========================================== */

.character-image {

  display: block;

  width: 100%;

  max-width: 280px;

  height: auto;

  margin: 0 auto;

  border: 0;

  outline: 0;

  background: transparent;

  object-fit: contain;

  transform-origin:
    center bottom;

  filter:

    drop-shadow(
      0 0 6px
      rgba(255,255,255,.45)
    )

    drop-shadow(
      0 0 15px
      rgba(180,135,255,.55)
    );
}


/* ==========================================
   🦉 STELLA
========================================== */

.stella .character-image {

  animation:
    stellaWave
    2.2s
    ease-in-out
    infinite;
}


@keyframes stellaWave {

  0%,
  100% {

    transform:
      translateY(0)
      rotate(-2deg);

  }

  25% {

    transform:
      translateY(-6px)
      rotate(3deg);

  }

  50% {

    transform:
      translateY(0)
      rotate(-1deg);

  }

  75% {

    transform:
      translateY(-5px)
      rotate(3deg);

  }

}


/* ==========================================
   🐈‍⬛ LUNA
========================================== */

.luna .character-image {

  animation:
    lunaWave
    2.6s
    ease-in-out
    infinite;
}


@keyframes lunaWave {

  0%,
  100% {

    transform:
      translateY(0)
      rotate(2deg);

  }

  25% {

    transform:
      translateY(-6px)
      rotate(-3deg);

  }

  50% {

    transform:
      translateY(0)
      rotate(1deg);

  }

  75% {

    transform:
      translateY(-7px)
      rotate(-3deg);

  }

}


/* ==========================================
   💬 SPEECH BUBBLES
========================================== */

.bubble {

  position: absolute;

  z-index: 20;

  top: -25px;
  left: 50%;

  transform:
    translate(-50%, -100%);

  width: max-content;

  max-width: 180px;

  padding:
    10px
    14px;

  border-radius: 18px;

  background: white;

  color: #251549;

  font-size: 13px;

  font-weight: 800;

  box-shadow:

    0 0 10px
    rgba(255,255,255,.6),

    0 0 22px
    rgba(185,140,255,.55);

  animation:
    bubbleFloat
    2.5s
    ease-in-out
    infinite;
}


.bubble::after {

  content: "";

  position: absolute;

  bottom: -9px;
  left: 50%;

  transform:
    translateX(-50%);

  border-left:
    9px solid transparent;

  border-right:
    9px solid transparent;

  border-top:
    10px solid white;
}


@keyframes bubbleFloat {

  0%,
  100% {

    transform:
      translate(-50%, -100%)
      translateY(0);

  }

  50% {

    transform:
      translate(-50%, -100%)
      translateY(-5px);

  }

}


/* ==========================================
   ✨ FALLING MAGIC
========================================== */

.magic {

  position: absolute;

  z-index: 3;

  top: -25px;

  pointer-events: none;

  color: white;

  text-shadow:

    0 0 5px white,

    0 0 12px #cdb4ff,

    0 0 18px #8fc8ff;

  animation:
    fall linear forwards;
}


@keyframes fall {

  0% {

    transform:
      translateY(-25px)
      rotate(0deg);

    opacity: 0;

  }

  12% {
    opacity: .9;
  }

  85% {
    opacity: .7;
  }

  100% {

    transform:
      translateY(680px)
      rotate(200deg);

    opacity: 0;

  }

}


/* ==========================================
   🌙 LINKS
========================================== */

.footer-links {

  position: relative;

  z-index: 10;

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap:
    10px
    24px;

  margin:
    30px auto 15px;
}


.footer-links a {

  color: #ddd4ff;

  text-decoration: none;

  font-size: 14px;

  font-weight: 700;
}


.footer-links a:hover {

  color: white;

  text-shadow:
    0 0 8px #c5a6ff;
}


/* ==========================================
   COPYRIGHT
========================================== */

.copyright {

  position: relative;

  z-index: 10;

  margin-top: 15px;

  font-size: 12px;

  line-height: 1.6;

  color:
    rgba(255,255,255,.6);
}


/* ==========================================
   📱 PHONE
========================================== */

@media (max-width: 600px) {

  .goodbye {

    min-height: 560px;

    padding:
      35px
      8px
      20px;

  }


  .moon {

    width: 48px;
    height: 48px;

    right: 4%;
    top: 25px;

  }


  .moon::after {

    width: 48px;
    height: 48px;

    top: -8px;
    left: 14px;

  }


  .title {

    padding:
      0
      45px;

  }


  .characters {

    margin-top: 85px;

    gap: 8px;

  }


  .character {

    width: 44vw;

  }


  .character-image {

    max-width: 210px;

  }


  .bubble {

    max-width: 135px;

    padding:
      8px
      9px;

    font-size: 10px;

  }

}

</style>

</head>


<body>


<footer class="goodbye">


  <!-- ✨ STARS -->

  <div class="starfield"></div>


  <!-- 🌙 MOON -->

  <div class="moon"></div>



  <!-- 💜 MESSAGE -->

  <h1 class="title">

    Thanks for stopping by! ✨

  </h1>


  <p class="subtitle">

    Come back soon — there's always
    more magic being made at
    Moonlight Designs.

  </p>



  <!-- 🦉🐈‍⬛ CHARACTERS -->

  <div class="characters">


    <!-- STELLA -->

    <div class="character stella">


      <div class="bubble">

        Thanks for visiting! ✨

      </div>


      <img

        class="character-image"

        src="https://500blueprint.github.io/Goodbye-footer-/Stella2.PNG"

        alt="Stella"

      >


    </div>



    <!-- LUNA -->

    <div class="character luna">


      <div class="bubble">

        Come back soon! 🌙

      </div>


      <img

        class="character-image"

        src="https://500blueprint.github.io/Goodbye-footer-/Luna2.PNG"

        alt="Luna"

      >


    </div>


  </div>



  <!-- 🌙 LINKS -->

  <div class="footer-links">


    <a
      href="https://payhip.com/MoonlightDesigns87"
      target="_top">

      Home

    </a>


    <a
      href="https://payhip.com/MoonlightDesigns87"
      target="_top">

      Shop

    </a>


    <a
      href="https://payhip.com/MoonlightDesigns87/collection/luna-s-freebies"
      target="_top">

      Freebies

    </a>


  </div>



  <!-- COPYRIGHT -->

  <div class="copyright">

    © 2026 Moonlight Designs

    <br>

    Turning Ideas Into Beautiful Creations ✨

  </div>


</footer>



<script>

/* ==========================================
   ✨ FALLING STARS + MOONS
========================================== */

const footer =
  document.querySelector(".goodbye");


const symbols = [
  "✦",
  "✧",
  "⋆",
  "★",
  "☾"
];


function createMagic() {

  const magic =
    document.createElement("span");


  magic.className =
    "magic";


  magic.textContent =
    symbols[
      Math.floor(
        Math.random()
        *
        symbols.length
      )
    ];


  magic.style.left =
    Math.random()
    *
    100
    +
    "%";


  magic.style.fontSize =
    (
      8
      +
      Math.random()
      *
      13
    )
    +
    "px";


  magic.style.animationDuration =
    (
      7
      +
      Math.random()
      *
      6
    )
    +
    "s";


  footer.appendChild(
    magic
  );


  setTimeout(

    function () {

      magic.remove();

    },

    14000

  );

}


setInterval(
  createMagic,
  700
);


for (
  let i = 0;
  i < 10;
  i++
) {

  setTimeout(
    createMagic,
    i * 170
  );

}

</script>


</body>

</html>
